# 流水线显示的名称（Action页面的标题）
name: CI

#触发器：什么时候跑
on:
  push:
    branches: [main] #push到main时
  pull_request: #任何pr创建/更新时（无论目标分支是谁）

# 工作岗位列表
jobs:
  build-and-test: #job的id(自己起名)
    runs-on: ubuntu-latest #申请一台github托管的ubuntu虚拟机
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5 #官方积木： 把仓库代码下载到 runner

      - name: 安装.net sdk
        uses: actions/setup-dotnet@v5 # 官方积木：在runner上装sdk
        with: #传给这个积木的参数（像函数参数）
          dotnet-version: 10.0.x # 指定要安装的 .NET SDK 版本

      - name: 缓存 Nuget 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 还原依赖
        run: dotnet restore

      - name: 编译
        run: dotnet build --no-restore

      - name: 代码格式检查
        run: dotnet format --verify-no-changes

      - name: 测试（含覆盖率检查）
        run: dotnet test /p:CollectCoverage=true /p:Threshold=80 /p:thresholdType=line

      - name: 发布产物
        run: dotnet publish TodoApi/TodoApi.csproj -c Release -o ./publish

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-${{ github.sha }} #制品名称
          path: ./publish #制品路径
  
  docker:
    if: github.event_name == 'push' # 仅在push时才跑docker job
    needs: build-and-test # 依赖上一个job
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
      
      - name: 准备 Buildkit
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api:latest
            ghcr.io/${{ github.repository_owner }}/todo-api:${{ github.sha }}
          
          cache-from: type=gha
          cache-to: type=gha,mode=max
